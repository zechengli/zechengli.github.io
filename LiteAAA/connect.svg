<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Arial, Helvetica, sans-serif" fill="#000">
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z"/></marker>
<marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z"/></marker>
</defs>
<rect width="900" height="470" fill="#fff"/>
<rect x="250" y="14" width="400" height="44" fill="#e6e6e6" stroke="#000" stroke-width="1.5"/>
<text x="450" y="41" text-anchor="middle" font-size="14" font-weight="bold">LiteAAA core: the same rules run on both sides</text>
<line x1="450" y1="58" x2="450" y2="170" stroke="#000" stroke-width="1.5"/>
<rect x="20" y="104" width="220" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="130" y="125" text-anchor="middle" font-size="14" font-weight="bold">Ring</text>
<text x="130" y="144" text-anchor="middle" font-size="13">NFC or Bluetooth</text>
<line x1="240" y1="129" x2="255" y2="129" stroke="#000" stroke-width="1.5"/>
<rect x="20" y="164" width="220" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="130" y="185" text-anchor="middle" font-size="14" font-weight="bold">Earring</text>
<text x="130" y="204" text-anchor="middle" font-size="13">Bluetooth</text>
<line x1="240" y1="189" x2="255" y2="189" stroke="#000" stroke-width="1.5"/>
<rect x="20" y="224" width="220" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="130" y="245" text-anchor="middle" font-size="14" font-weight="bold">Little button</text>
<text x="130" y="264" text-anchor="middle" font-size="13">Bluetooth or low-power radio</text>
<line x1="240" y1="249" x2="255" y2="249" stroke="#000" stroke-width="1.5"/>
<rect x="20" y="284" width="220" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="130" y="305" text-anchor="middle" font-size="14" font-weight="bold">Phone</text>
<text x="130" y="324" text-anchor="middle" font-size="13">cellular, Wi-Fi or Bluetooth</text>
<line x1="240" y1="309" x2="255" y2="309" stroke="#000" stroke-width="1.5"/>
<rect x="660" y="104" width="220" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="770" y="125" text-anchor="middle" font-size="14" font-weight="bold">B210 radio with a PC</text>
<text x="770" y="144" text-anchor="middle" font-size="13">a radio link, over the air</text>
<line x1="645" y1="129" x2="660" y2="129" stroke="#000" stroke-width="1.5"/>
<rect x="660" y="164" width="220" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="770" y="185" text-anchor="middle" font-size="14" font-weight="bold">Phone</text>
<text x="770" y="204" text-anchor="middle" font-size="13">Bluetooth or NFC</text>
<line x1="645" y1="189" x2="660" y2="189" stroke="#000" stroke-width="1.5"/>
<rect x="660" y="224" width="220" height="50" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="770" y="245" text-anchor="middle" font-size="14" font-weight="bold">PC or server</text>
<text x="770" y="264" text-anchor="middle" font-size="13">the internet (this demo)</text>
<line x1="645" y1="249" x2="660" y2="249" stroke="#000" stroke-width="1.5"/>
<line x1="255" y1="129" x2="255" y2="309" stroke="#000" stroke-width="1.5"/>
<line x1="645" y1="129" x2="645" y2="249" stroke="#000" stroke-width="1.5"/>
<rect x="330" y="170" width="240" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="450" y="206" text-anchor="middle" font-size="14" font-weight="bold">Reach plug-in</text>
<text x="450" y="225" text-anchor="middle" font-size="13">carries the bytes both ways</text>
<line x1="263" y1="210" x2="322" y2="210" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
<line x1="578" y1="210" x2="637" y2="210" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
<text x="450" y="276" text-anchor="middle" font-size="13">Any thing on the left pairs with any</text>
<text x="450" y="293" text-anchor="middle" font-size="13">thing on the right, if both use the same Reach.</text>
<line x1="130" y1="334" x2="130" y2="360" stroke="#000" stroke-width="1.5"/>
<line x1="770" y1="274" x2="770" y2="360" stroke="#000" stroke-width="1.5"/>
<rect x="20" y="360" width="220" height="56" fill="#fff" stroke="#000" stroke-dasharray="5 4"/>
<text x="130" y="384" text-anchor="middle" font-size="14" font-weight="bold">SIM plug-in</text>
<text x="130" y="403" text-anchor="middle" font-size="13">holds the key in the device</text>
<rect x="660" y="360" width="220" height="56" fill="#fff" stroke="#000" stroke-dasharray="5 4"/>
<text x="770" y="384" text-anchor="middle" font-size="14" font-weight="bold">Key store plug-in</text>
<text x="770" y="403" text-anchor="middle" font-size="13">holds the keys in the network</text>
<text x="450" y="452" text-anchor="middle" font-size="13">Examples only. None of these is built yet, except the last one on the right.</text>
</svg>
