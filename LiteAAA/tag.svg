<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="Arial, Helvetica, sans-serif" fill="#000">
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z"/></marker>
<marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z"/></marker>
</defs>
<rect width="900" height="680" fill="#fff"/>
<text x="20" y="34" text-anchor="start" font-size="15" font-weight="bold">What is on it</text>
<rect x="20" y="90" width="130" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="85" y="117" text-anchor="middle" font-size="14" font-weight="bold">Button cell</text>
<text x="85" y="135" text-anchor="middle" font-size="13">1.55 V</text>
<line x1="150" y1="120" x2="182" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="200" width="130" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="85" y="227" text-anchor="middle" font-size="14" font-weight="bold">Antenna</text>
<text x="85" y="245" text-anchor="middle" font-size="13">2.4 GHz</text>
<line x1="158" y1="230" x2="182" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
<rect x="190" y="60" width="250" height="240" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="315" y="88" text-anchor="middle" font-size="14" font-weight="bold">One chip with a Bluetooth radio</text>
<text x="205" y="122" text-anchor="start" font-size="13">runs: the LiteAAA device half</text>
<text x="205" y="149" text-anchor="start" font-size="13">stores: key K, identity, counter</text>
<text x="205" y="176" text-anchor="start" font-size="13">does: AES-128 (built into the chip)</text>
<text x="205" y="203" text-anchor="start" font-size="13">sleeps, and wakes on a timer</text>
<text x="205" y="240" text-anchor="start" font-size="13">Size: 1.7 x 2.05 mm.</text>
<text x="205" y="260" text-anchor="start" font-size="13">Runs from a single 1.5 V cell.</text>
<line x1="250" y1="300" x2="250" y2="330" stroke="#000" stroke-width="1.5"/>
<line x1="380" y1="300" x2="380" y2="330" stroke="#000" stroke-width="1.5"/>
<rect x="190" y="330" width="120" height="52" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="353" text-anchor="middle" font-size="14" font-weight="bold">Crystal</text>
<text x="250" y="371" text-anchor="middle" font-size="13">radio clock</text>
<rect x="320" y="330" width="120" height="52" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="380" y="353" text-anchor="middle" font-size="14" font-weight="bold">Capacitor</text>
<text x="380" y="371" text-anchor="middle" font-size="13">for radio bursts</text>
<text x="20" y="424" text-anchor="start" font-size="15" font-weight="bold">Size, to the same scale</text>
<circle cx="72" cy="494" r="52" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
<text x="72" y="566" text-anchor="middle" font-size="13">Before: 13 mm</text>
<circle cx="200" cy="523" r="23" fill="#ddd" stroke="#000" stroke-width="1.5"/>
<text x="200" y="566" text-anchor="middle" font-size="13" font-weight="bold">Now: 5.8 mm</text>
<text x="270" y="470" text-anchor="start" font-size="13">About the size of</text>
<text x="270" y="488" text-anchor="start" font-size="13">a small earring stud.</text>
<text x="20" y="606" text-anchor="start" font-size="15" font-weight="bold">What this size costs</text>
<text x="20" y="628" text-anchor="start" font-size="13">Battery life: weeks to a few months (rough guess).</text>
<text x="20" y="646" text-anchor="start" font-size="13">Radio range: very short. No room for a secure chip.</text>
<text x="20" y="664" text-anchor="start" font-size="13">Parts as small as 0.6 mm: machine assembly only.</text>
<text x="480" y="34" text-anchor="start" font-size="15" font-weight="bold">Top view, to scale</text>
<circle cx="620" cy="215" r="116" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
<rect x="580" y="114" width="80" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/>
<rect x="540" y="175" width="68" height="82" fill="#ddd" stroke="#000" stroke-width="1.5"/>
<text x="574" y="221" text-anchor="middle" font-size="13" font-weight="bold">Chip</text>
<rect x="625" y="172" width="64" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
<rect x="625" y="232" width="64" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
<rect x="560" y="275" width="24" height="12" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="590" y="275" width="24" height="12" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="620" y="275" width="24" height="12" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="650" y="275" width="24" height="12" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="600" cy="305" r="5" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="620" cy="305" r="5" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="640" cy="305" r="5" fill="#fff" stroke="#000" stroke-width="1"/>
<line x1="660" y1="136" x2="752" y2="136" stroke="#000" stroke-width="1"/>
<text x="758" y="141" text-anchor="start" font-size="13">Antenna</text>
<line x1="689" y1="196" x2="752" y2="196" stroke="#000" stroke-width="1"/>
<text x="758" y="201" text-anchor="start" font-size="13">Crystal</text>
<line x1="689" y1="248" x2="752" y2="248" stroke="#000" stroke-width="1"/>
<text x="758" y="253" text-anchor="start" font-size="13">Capacitor</text>
<line x1="674" y1="281" x2="752" y2="281" stroke="#000" stroke-width="1"/>
<text x="758" y="286" text-anchor="start" font-size="13">Small parts</text>
<line x1="645" y1="305" x2="752" y2="305" stroke="#000" stroke-width="1"/>
<text x="758" y="310" text-anchor="start" font-size="13">Pads</text>
<text x="620" y="356" text-anchor="middle" font-size="13" font-weight="bold">Board: 5.8 mm across</text>
<rect x="530" y="400" width="68" height="24" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="610" y="400" width="64" height="24" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="685" y="400" width="24" height="24" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="504" y="424" width="232" height="16" fill="#ddd" stroke="#000" stroke-width="1.5"/>
<rect x="504" y="440" width="232" height="86" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="620" y="478" text-anchor="middle" font-size="13">Silver-oxide cell SR521SW</text>
<text x="620" y="498" text-anchor="middle" font-size="13">5.8 mm x 2.15 mm, about 16 mAh</text>
<text x="620" y="550" text-anchor="middle" font-size="13" font-weight="bold">Side view: about 3.2 mm thick</text>
<text x="620" y="668" text-anchor="middle" font-size="13">Design sketch. Not built or tested.</text>
</svg>
