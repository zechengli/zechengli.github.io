<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="Arial, Helvetica, sans-serif" fill="#000">
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z"/></marker>
<marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z"/></marker>
</defs>
<rect width="900" height="570" fill="#fff"/>
<text x="20" y="34" text-anchor="start" font-size="15" font-weight="bold">What is on it</text>
<rect x="20" y="90" width="130" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="85" y="117" text-anchor="middle" font-size="14" font-weight="bold">Coin cell</text>
<text x="85" y="135" text-anchor="middle" font-size="13">3 V</text>
<line x1="150" y1="120" x2="182" y2="120" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="200" width="130" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="85" y="227" text-anchor="middle" font-size="14" font-weight="bold">Antenna</text>
<text x="85" y="245" text-anchor="middle" font-size="13">2.4 GHz</text>
<line x1="158" y1="230" x2="182" y2="230" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
<rect x="190" y="60" width="250" height="240" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="315" y="88" text-anchor="middle" font-size="14" font-weight="bold">MCU with Bluetooth radio</text>
<text x="205" y="122" text-anchor="start" font-size="13">runs: the LiteAAA device half</text>
<text x="205" y="149" text-anchor="start" font-size="13">stores: key K, identity, counter</text>
<text x="205" y="176" text-anchor="start" font-size="13">does: AES-128 (built into the chip)</text>
<text x="205" y="203" text-anchor="start" font-size="13">sleeps, and wakes on a timer</text>
<text x="205" y="240" text-anchor="start" font-size="13">One chip, about 3 x 3 mm.</text>
<text x="205" y="260" text-anchor="start" font-size="13">Nothing else is needed to verify.</text>
<line x1="250" y1="300" x2="250" y2="330" stroke="#000" stroke-width="1.5"/>
<line x1="380" y1="300" x2="380" y2="330" stroke="#000" stroke-width="1.5"/>
<rect x="190" y="330" width="120" height="52" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="353" text-anchor="middle" font-size="14" font-weight="bold">Crystal</text>
<text x="250" y="371" text-anchor="middle" font-size="13">radio clock</text>
<rect x="320" y="330" width="120" height="52" fill="#fff" stroke="#000" stroke-width="1" stroke-dasharray="5 4"/>
<text x="380" y="353" text-anchor="middle" font-size="14" font-weight="bold">Secure chip</text>
<text x="380" y="371" text-anchor="middle" font-size="13">optional: holds K</text>
<text x="480" y="34" text-anchor="start" font-size="15" font-weight="bold">Top view, to scale</text>
<circle cx="620" cy="200" r="120" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
<rect x="590" y="95" width="61" height="31" fill="#fff" stroke="#000" stroke-width="1.5"/>
<rect x="565" y="165" width="58" height="58" fill="#ddd" stroke="#000" stroke-width="1.5"/>
<text x="594" y="199" text-anchor="middle" font-size="13" font-weight="bold">MCU</text>
<rect x="650" y="150" width="38" height="31" fill="#fff" stroke="#000" stroke-width="1.5"/>
<rect x="650" y="200" width="19" height="10" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="675" y="200" width="19" height="10" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="650" y="218" width="19" height="10" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="675" y="218" width="19" height="10" fill="#fff" stroke="#000" stroke-width="1"/>
<circle cx="590" cy="285" r="6" fill="#fff" stroke="#000"/>
<circle cx="610" cy="285" r="6" fill="#fff" stroke="#000"/>
<circle cx="630" cy="285" r="6" fill="#fff" stroke="#000"/>
<circle cx="650" cy="285" r="6" fill="#fff" stroke="#000"/>
<line x1="651" y1="110" x2="752" y2="110" stroke="#000" stroke-width="1"/>
<text x="758" y="115" text-anchor="start" font-size="13">Antenna</text>
<line x1="688" y1="165" x2="752" y2="165" stroke="#000" stroke-width="1"/>
<text x="758" y="170" text-anchor="start" font-size="13">Crystal</text>
<line x1="694" y1="214" x2="752" y2="214" stroke="#000" stroke-width="1"/>
<text x="758" y="219" text-anchor="start" font-size="13">Small parts</text>
<line x1="656" y1="285" x2="752" y2="285" stroke="#000" stroke-width="1"/>
<text x="758" y="290" text-anchor="start" font-size="13">Programming pads</text>
<text x="620" y="345" text-anchor="middle" font-size="13" font-weight="bold">Board: about 13 mm across</text>
<rect x="530" y="385" width="58" height="15" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="600" y="385" width="38" height="15" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="650" y="385" width="19" height="15" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="680" y="385" width="19" height="15" fill="#fff" stroke="#000" stroke-width="1"/>
<rect x="500" y="400" width="240" height="12" fill="#ddd" stroke="#000" stroke-width="1.5"/>
<rect x="500" y="412" width="240" height="38" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="620" y="436" text-anchor="middle" font-size="13">Coin cell CR1220, 2 mm</text>
<text x="620" y="472" text-anchor="middle" font-size="13" font-weight="bold">Side view: parts, board, coin cell.</text>
<text x="620" y="490" text-anchor="middle" font-size="13" font-weight="bold">About 4 mm thick.</text>
<text x="20" y="420" text-anchor="start" font-size="15" font-weight="bold">How it lives</text>
<text x="20" y="446" text-anchor="start" font-size="13">Asleep almost all the time.</text>
<text x="20" y="465" text-anchor="start" font-size="13">Every few seconds: wake, say its identity,</text>
<text x="20" y="484" text-anchor="start" font-size="13">listen briefly for a page, sleep again.</text>
<text x="20" y="503" text-anchor="start" font-size="13">If paged: answer, do the challenge (5 AES), sleep.</text>
<text x="20" y="522" text-anchor="start" font-size="13">Battery life with this small cell: months (rough guess).</text>
<text x="20" y="541" text-anchor="start" font-size="13">A bigger cell (CR2032, 20 mm) lasts much longer.</text>
<text x="450" y="560" text-anchor="middle" font-size="13">Design sketch. Not built or tested. Radio range will be short at this size.</text>
</svg>
