<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="Arial, Helvetica, sans-serif" fill="#000">
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z"/></marker>
<marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z"/></marker>
</defs>
<rect width="900" height="330" fill="#fff"/>
<rect x="30" y="70" width="250" height="150" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
<text x="155" y="94" text-anchor="middle" font-size="15" font-weight="bold">PC</text>
<rect x="50" y="108" width="210" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="155" y="130" text-anchor="middle" font-size="13">LiteAAA network half</text>
<rect x="50" y="160" width="210" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="155" y="182" text-anchor="middle" font-size="13">key store: the SIM's K</text>
<rect x="360" y="90" width="180" height="110" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
<text x="450" y="114" text-anchor="middle" font-size="14" font-weight="bold">B210</text>
<text x="450" y="140" text-anchor="middle" font-size="12">turns the samples</text>
<text x="450" y="158" text-anchor="middle" font-size="12">into a real signal</text>
<text x="450" y="176" text-anchor="middle" font-size="12">(or ZMQ: a software</text>
<text x="450" y="192" text-anchor="middle" font-size="12">cable, no emission)</text>
<line x1="280" y1="145" x2="358" y2="145" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
<text x="320" y="136" text-anchor="middle" font-size="13">samples</text>
<rect x="620" y="70" width="250" height="150" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
<text x="745" y="94" text-anchor="middle" font-size="15" font-weight="bold">Phone</text>
<rect x="640" y="108" width="210" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="745" y="130" text-anchor="middle" font-size="13">LiteAAA device half</text>
<rect x="640" y="160" width="210" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="745" y="182" text-anchor="middle" font-size="13">real SIM card: K, RES</text>
<line x1="542" y1="145" x2="618" y2="145" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
<text x="580" y="136" text-anchor="middle" font-size="13">radio</text>
<text x="450" y="250" text-anchor="middle" font-size="14">The network pages and challenges. The real SIM checks the network and answers.</text>
<text x="450" y="276" text-anchor="middle" font-size="15" font-weight="bold">No Open5GS. No core network.</text>
<text x="450" y="308" text-anchor="middle" font-size="13">First build and test over ZMQ (a software cable, nothing transmitted).</text>
