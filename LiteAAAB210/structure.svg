<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Arial, Helvetica, sans-serif" fill="#000">
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z"/></marker>
<marker id="b" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z"/></marker>
</defs>
<rect width="900" height="360" fill="#fff"/>
<rect x="20" y="70" width="250" height="180" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
<text x="145" y="96" text-anchor="middle" font-size="15" font-weight="bold">PC</text>
<rect x="40" y="110" width="210" height="34" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="145" y="132" text-anchor="middle" font-size="13">LTE core</text>
<rect x="40" y="150" width="210" height="34" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="145" y="172" text-anchor="middle" font-size="13">LiteAAA network half</text>
<rect x="40" y="190" width="210" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="145" y="206" text-anchor="middle" font-size="13">key store</text>
<text x="145" y="222" text-anchor="middle" font-size="11">a copy of the SIM key</text>
<rect x="360" y="120" width="130" height="80" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
<text x="425" y="150" text-anchor="middle" font-size="15" font-weight="bold">B210</text>
<text x="425" y="172" text-anchor="middle" font-size="12">radio</text>
<line x1="270" y1="160" x2="358" y2="160" stroke="#000" stroke-width="1.5" marker-end="url(#a)"/>
<text x="315" y="151" text-anchor="middle" font-size="11">USB</text>
<rect x="630" y="70" width="250" height="180" fill="#f2f2f2" stroke="#000" stroke-width="1.5"/>
<text x="755" y="96" text-anchor="middle" font-size="15" font-weight="bold">OnePlus 13</text>
<rect x="650" y="110" width="210" height="34" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="755" y="132" text-anchor="middle" font-size="13">modem</text>
<rect x="650" y="150" width="210" height="34" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="755" y="172" text-anchor="middle" font-size="13">LiteAAA app</text>
<rect x="650" y="190" width="210" height="40" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="755" y="206" text-anchor="middle" font-size="13">SIM card</text>
<text x="755" y="222" text-anchor="middle" font-size="11">holds the key, never shows it</text>
<line x1="492" y1="160" x2="628" y2="160" stroke="#000" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#b)"/>
<text x="560" y="150" text-anchor="middle" font-size="12" font-weight="bold">over the air</text>
<text x="560" y="185" text-anchor="middle" font-size="11">LTE, band 3</text>
<text x="450" y="290" text-anchor="middle" font-size="13">1. The modem attaches to the cell and authenticates with the SIM (normal cellular).</text>
<text x="450" y="314" text-anchor="middle" font-size="13">2. The LiteAAA app runs its paging, challenge and nonce over that link, asking the same SIM.</text>
<text x="450" y="344" text-anchor="middle" font-size="12">The key is in two places only: the SIM card and the PC key store. It never travels.</text>
</svg>
